name: iOS swift compat probe (temporal)

# Xcode 26 no trae libswiftCompatibility56.a, y el Swift de los plugins de Tauri
# la pide porque tauri-utils lo compila para iOS 13 salvo que se le diga otra
# cosa. La pregunta que decide el arreglo es: a partir de que deployment target
# deja swiftc de emitir ese simbolo. Medirlo aqui cuesta dos minutos; probarlo
# a ciegas en el build de verdad, diez cada vez.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Which deployment target stops asking for the compat library
        run: |
          set -uo pipefail
          newest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version

          echo 'public func lt_probe() {}' > probe.swift
          for target in 13.0 15.0 15.4 16.0 17.0; do
            xcrun -sdk iphoneos swiftc -target "arm64-apple-ios$target" \
              -emit-object probe.swift -o "probe-$target.o" 2>/dev/null
            forced="$(nm "probe-$target.o" | grep FORCE_LOAD | sed 's/.*_\$_//' | sort -u | tr '\n' ' ')"
            echo "ios $target -> ${forced:-(ninguna)}"
          done

          echo "--- compat libs que trae Xcode 26 ---"
          ls "$newest/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos/" \
            | grep -i compat || echo "(ninguna)"

          echo "--- compat libs que traia Xcode 16.4 ---"
          ls /Applications/Xcode_16.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos/ 2>/dev/null \
            | grep -i compat || echo "(no hay Xcode 16.4 en la imagen)"
