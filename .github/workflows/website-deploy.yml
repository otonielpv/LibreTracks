name: Deploy website

# The website (apps/website, Cloudflare Pages) is deployed on purpose, not on
# every push to main:
#
# - when a release is published: release.yml only leaves a DRAFT, and clicking
#   "Publish release" on GitHub (once the store reviews are approved) fires
#   this, so the download page picks the new version up then and not before;
# - by hand: run this workflow from the Actions tab.
#
# The `release` event comes from the person's click. A release published with
# a workflow's own GITHUB_TOKEN would not trigger it.
#
# For this to be the only road, automatic production deployments must be OFF
# in the Cloudflare Pages project (Settings → Builds & deployments → Branch
# control). The deploy hook keeps working with them off.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Cloudflare Pages build
    # Only app releases (v*): the repository also holds releases that mirror
    # build dependencies (libmpv-*), and publishing one of those must not put
    # the website of an unreleased version online.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Send Deploy Hook to Cloudflare
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::The CLOUDFLARE_DEPLOY_HOOK secret is not set."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
