name: iOS Smoke (unsigned IPA)

# The IPA a tester side-loads with AltStore. Same engine, same Xcode project
# and same checks as the signed App Store build (ios-release.yml) — they share
# the composite actions and scripts/verify-ios-ipa.sh — but no Apple
# credentials are involved, so it also runs on forks.

env:
  BUNGEE_VERSION: v2.4.24
  FFMPEG_VERSION: 7.1.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain for iPhone
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-ios-ci

      - name: Install JavaScript dependencies
        run: npm ci

      # Tauri resolves and validates bundle.resources before it executes the
      # platform beforeBuildCommand. Build this inherited resource up front;
      # otherwise a clean runner fails before either frontend build can start.
      - name: Build bundled remote frontend
        run: npm run build:remote

      - name: Build native audio engine and dependencies
        uses: ./.github/actions/ios-native-deps
        with:
          bungee-version: ${{ env.BUNGEE_VERSION }}
          ffmpeg-version: ${{ env.FFMPEG_VERSION }}

      - name: Generate the Xcode project
        uses: ./.github/actions/ios-xcode-project

      # Tauri 2.10 does not expose a --no-sign flag. Keep `tauri ios build` as
      # the wrapper because its Xcode script needs Tauri's temporary options
      # server, but disable signing in the generated project. Exporting may
      # fail without a profile; the unsigned .app is already in the archive.
      - name: Build unsigned arm64 IPA
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ios-ci
        shell: bash
        run: |
          set -euo pipefail
          apple_dir="apps/desktop/src-tauri/gen/apple"
          staging_dir="$RUNNER_TEMP/libretracks-ipa"
          ipa_dir="$apple_dir/build/arm64"
          pbxproj="$apple_dir/libretracks-desktop.xcodeproj/project.pbxproj"

          perl -0pi -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' "$pbxproj"
          grep -q 'CODE_SIGNING_ALLOWED = NO' "$pbxproj"

          set +e
          (
            cd apps/desktop
            npm run tauri -- ios build --ci --target aarch64
          )
          tauri_status=$?
          set -e

          app="$(find "$apple_dir" "$HOME/Library/Developer/Xcode/Archives" \
            -type d -path '*.xcarchive/Products/Applications/*.app' \
            -print -quit 2>/dev/null || true)"
          if [ -z "$app" ]; then
            echo "Tauri exited with $tauri_status and produced no archived app" >&2
            find "$apple_dir" -maxdepth 5 -type d -name '*.app' -print || true
            if [ "$tauri_status" -eq 0 ]; then
              tauri_status=1
            fi
            exit "$tauri_status"
          fi

          mkdir -p "$staging_dir/Payload" "$ipa_dir"
          ditto "$app" "$staging_dir/Payload/LibreTracks.app"
          (
            cd "$staging_dir"
            zip -qry --symlinks "$GITHUB_WORKSPACE/$ipa_dir/LibreTracks-unsigned.ipa" Payload
          )

      - name: Verify the IPA
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find apps/desktop/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "Tauri completed but produced no IPA" >&2
            find apps/desktop/src-tauri/gen/apple/build -maxdepth 3 -type f -print || true
            exit 1
          fi
          bash scripts/verify-ios-ipa.sh "$ipa" --unsigned
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LibreTracks-iOS-unsigned-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LibreTracks-iOS-build-diagnostics-${{ github.run_number }}
          path: |
            apps/desktop/src-tauri/gen/apple/project.yml
            apps/desktop/src-tauri/gen/apple/**/*.plist
            apps/desktop/src-tauri/gen/apple/**/*.pbxproj
          if-no-files-found: ignore
          retention-days: 7
