name: iOS Smoke (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-smoke-ci

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain for iPhone
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-ios-ci

      - name: Verify Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build native audio engine for iPhone
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/native/audio-engine-v2/build-ios-arm64"
          link_dir="$GITHUB_WORKSPACE/native/audio-engine-v2/build-ios-link"

          cmake -S native/audio-engine-v2 -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DLT_ENGINE_BUILD_TESTS=OFF \
            -DLT_ENGINE_BUILD_BENCHES=OFF \
            -DLT_ENGINE_USE_JUCE=ON \
            -DLT_ENGINE_USE_OBOE=OFF \
            -DLT_ENGINE_USE_FFMPEG=OFF \
            -DLT_ENGINE_USE_LIBSNDFILE=ON \
            -DLT_ENGINE_USE_R8BRAIN=ON \
            -DLT_ENGINE_USE_BUNGEE=OFF
          cmake --build "$build_dir" --parallel 3

          mkdir -p "$link_dir"
          engine_archive="$(find "$build_dir" -name 'liblt_audio_engine_v2.a' -print -quit)"
          sndfile_archive="$(find "$build_dir" -name 'libsndfile.a' -print -quit)"
          test -n "$engine_archive"
          test -n "$sndfile_archive"
          cp "$engine_archive" "$link_dir/liblt_audio_engine_v2.a"
          cp "$sndfile_archive" "$link_dir/libsndfile.a"
          lipo -info "$link_dir/liblt_audio_engine_v2.a"
          lipo -info "$link_dir/libsndfile.a"

          echo "LT_ENGINE_V2_LIB_DIR=$link_dir" >> "$GITHUB_ENV"

      # gen/apple is deliberately generated on the macOS runner. Tauri's iOS
      # project is derived from Cargo.toml, tauri.ios.conf.json and the plugin
      # set, so keeping generated Xcode files out of git avoids stale projects.
      - name: Generate Tauri iOS project
        working-directory: apps/desktop
        run: npm run tauri -- ios init --ci

      # Tauri 2.10 does not expose a --no-sign flag. Keep `tauri ios build` as
      # the wrapper because its Xcode script needs Tauri's temporary options
      # server, but disable signing in the generated project. Exporting may
      # fail without a profile; the unsigned .app is already in the archive.
      - name: Build unsigned arm64 IPA
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ios-ci
        shell: bash
        run: |
          set -euo pipefail
          apple_dir="apps/desktop/src-tauri/gen/apple"
          staging_dir="$RUNNER_TEMP/libretracks-ipa"
          ipa_dir="$apple_dir/build/arm64"
          pbxproj="$apple_dir/libretracks-desktop.xcodeproj/project.pbxproj"

          perl -0pi -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' "$pbxproj"
          grep -q 'CODE_SIGNING_ALLOWED = NO' "$pbxproj"

          set +e
          (
            cd apps/desktop
            npm run tauri -- ios build --ci --target aarch64
          )
          tauri_status=$?
          set -e

          app="$(find "$apple_dir" "$HOME/Library/Developer/Xcode/Archives" \
            -type d -path '*.xcarchive/Products/Applications/*.app' \
            -print -quit 2>/dev/null || true)"
          if [ -z "$app" ]; then
            echo "Tauri exited with $tauri_status and produced no archived app" >&2
            find "$apple_dir" -maxdepth 5 -type d -name '*.app' -print || true
            if [ "$tauri_status" -eq 0 ]; then
              tauri_status=1
            fi
            exit "$tauri_status"
          fi

          mkdir -p "$staging_dir/Payload" "$ipa_dir"
          ditto "$app" "$staging_dir/Payload/LibreTracks.app"
          (
            cd "$staging_dir"
            zip -qry --symlinks "$GITHUB_WORKSPACE/$ipa_dir/LibreTracks-unsigned.ipa" Payload
          )

      - name: Validate IPA structure and target
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find apps/desktop/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "Tauri completed but produced no IPA" >&2
            find apps/desktop/src-tauri/gen/apple/build -maxdepth 3 -type f -print || true
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/libretracks-ipa-check"
          mkdir -p "$verify_dir"
          unzip -q "$ipa" -d "$verify_dir"
          app="$(find "$verify_dir/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            echo "IPA does not contain Payload/<name>.app" >&2
            exit 1
          fi

          plist="$app/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          minimum_ios="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")"
          archs="$(lipo -archs "$app/$executable")"

          test "$bundle_id" = "com.libretracks.ios"
          test "$minimum_ios" = "15.0"
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "Expected arm64 executable, got: $archs" >&2; exit 1 ;;
          esac

          if ! nm -gU "$app/$executable" | grep -q '_lt_engine_create'; then
            echo "IPA executable does not contain the native audio engine C ABI" >&2
            exit 1
          fi
          if strings "$app/$executable" | grep -q '"error":"no-link"'; then
            echo "IPA executable still contains the silent no-link engine" >&2
            exit 1
          fi

          echo "IPA: $ipa"
          echo "Bundle: $bundle_id"
          echo "Minimum iOS: $minimum_ios"
          echo "Architectures: $archs"
          echo "Audio engine: native static C++ engine linked"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LibreTracks-iOS-unsigned-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LibreTracks-iOS-build-diagnostics-${{ github.run_number }}
          path: |
            apps/desktop/src-tauri/gen/apple/project.yml
            apps/desktop/src-tauri/gen/apple/**/*.plist
            apps/desktop/src-tauri/gen/apple/**/*.pbxproj
          if-no-files-found: ignore
          retention-days: 7
