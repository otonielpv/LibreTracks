name: iOS Smoke (unsigned IPA)

env:
  BUNGEE_VERSION: v2.4.24
  FFMPEG_VERSION: 7.1.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain for iPhone
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-ios-ci

      - name: Verify Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Install JavaScript dependencies
        run: npm ci

      # Tauri resolves and validates bundle.resources before it executes the
      # platform beforeBuildCommand. Build this inherited resource up front;
      # otherwise a clean runner fails before either frontend build can start.
      - name: Build bundled remote frontend
        run: npm run build:remote

      - name: Cache Bungee iOS build
        id: bungee-cache
        uses: actions/cache@v4
        with:
          path: bungee-ios-sdk
          key: bungee-ios-${{ env.BUNGEE_VERSION }}-arm64-ios15

      - name: Build Bungee for iPhone
        if: steps.bungee-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BUNGEE_VERSION" --recurse-submodules \
            https://github.com/bungee-audio-stretch/bungee.git bungee-ios-src
          cmake -S bungee-ios-src -B bungee-ios-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DBUNGEE_BUILD_SHARED_LIBRARY=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUNGEE_VERSION="${BUNGEE_VERSION#v}"
          cmake --build bungee-ios-src/build --target bungee_library pffft --parallel 3
          mkdir -p bungee-ios-sdk/include/bungee bungee-ios-sdk/ios-arm64
          cp bungee-ios-src/bungee/*.h bungee-ios-sdk/include/bungee/
          cp bungee-ios-src/build/libbungee.a bungee-ios-src/build/libpffft.a \
            bungee-ios-sdk/ios-arm64/
          lipo -info bungee-ios-sdk/ios-arm64/libbungee.a
          lipo -info bungee-ios-sdk/ios-arm64/libpffft.a

      - name: Cache FFmpeg iOS build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg-ios-arm64
          key: ffmpeg-ios-${{ env.FFMPEG_VERSION }}-arm64-ios15-static-lgpl-v1

      - name: Build LGPL FFmpeg for iPhone
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-ffmpeg-ios.sh "$PWD/vendor/ffmpeg-ios-arm64"

      - name: Build native audio engine for iPhone
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/native/audio-engine-v2/build-ios-arm64"
          link_dir="$GITHUB_WORKSPACE/native/audio-engine-v2/build-ios-link"
          ffmpeg_dir="$GITHUB_WORKSPACE/vendor/ffmpeg-ios-arm64"
          bungee_dir="$GITHUB_WORKSPACE/bungee-ios-sdk"

          export PKG_CONFIG_PATH="$ffmpeg_dir/lib/pkgconfig"

          cmake -S native/audio-engine-v2 -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DLT_ENGINE_BUILD_TESTS=OFF \
            -DLT_ENGINE_BUILD_BENCHES=OFF \
            -DLT_ENGINE_USE_JUCE=OFF \
            -DLT_ENGINE_USE_OBOE=OFF \
            -DLT_ENGINE_USE_FFMPEG=ON \
            -DLT_ENGINE_USE_LIBSNDFILE=ON \
            -DLT_ENGINE_USE_R8BRAIN=ON \
            -DLT_ENGINE_USE_BUNGEE=ON \
            -DLT_BUNGEE_DIR="$bungee_dir"
          cmake --build "$build_dir" --parallel 3

          mkdir -p "$link_dir"
          engine_archive="$(find "$build_dir" -name 'liblt_audio_engine_v2.a' -print -quit)"
          sndfile_archive="$(find "$build_dir" -name 'libsndfile.a' -print -quit)"
          test -n "$engine_archive"
          test -n "$sndfile_archive"
          cp "$engine_archive" "$link_dir/liblt_audio_engine_v2.a"
          cp "$sndfile_archive" "$link_dir/libsndfile.a"
          cp "$bungee_dir/ios-arm64/libbungee.a" \
             "$bungee_dir/ios-arm64/libpffft.a" \
             "$ffmpeg_dir/lib/libavformat.a" \
             "$ffmpeg_dir/lib/libavcodec.a" \
             "$ffmpeg_dir/lib/libavutil.a" \
             "$ffmpeg_dir/lib/libswresample.a" \
             "$link_dir/"
          lipo -info "$link_dir/liblt_audio_engine_v2.a"
          lipo -info "$link_dir/libsndfile.a"
          for library in libbungee.a libpffft.a libavformat.a libavcodec.a \
                         libavutil.a libswresample.a; do
            lipo -info "$link_dir/$library"
          done

          grep -q 'LT_ENGINE_USE_BUNGEE:BOOL=ON' "$build_dir/CMakeCache.txt"
          grep -q 'LT_ENGINE_USE_FFMPEG:BOOL=ON' "$build_dir/CMakeCache.txt"
          # JUCE must stay out of the iOS build. Its AGPLv3 licensing option is
          # incompatible with App Store distribution terms, and on iOS it only
          # ever wrapped RemoteIO — which audio_device_manager_ios.mm now owns.
          # A silent flip back to ON would build a shippable-looking IPA that
          # cannot legally ship, so fail the job instead.
          grep -q 'LT_ENGINE_USE_JUCE:BOOL=OFF' "$build_dir/CMakeCache.txt"

          echo "LT_ENGINE_IOS_LIB_DIR=$link_dir" >> "$GITHUB_ENV"

      # gen/apple is deliberately generated on the macOS runner. Tauri's iOS
      # project is derived from Cargo.toml, tauri.ios.conf.json and the plugin
      # set, so keeping generated Xcode files out of git avoids stale projects.
      - name: Generate Tauri iOS project
        working-directory: apps/desktop
        run: npm run tauri -- ios init --ci

      # Tauri 2.10 does not expose a --no-sign flag. Keep `tauri ios build` as
      # the wrapper because its Xcode script needs Tauri's temporary options
      # server, but disable signing in the generated project. Exporting may
      # fail without a profile; the unsigned .app is already in the archive.
      - name: Build unsigned arm64 IPA
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ios-ci
        shell: bash
        run: |
          set -euo pipefail
          apple_dir="apps/desktop/src-tauri/gen/apple"
          staging_dir="$RUNNER_TEMP/libretracks-ipa"
          ipa_dir="$apple_dir/build/arm64"
          pbxproj="$apple_dir/libretracks-desktop.xcodeproj/project.pbxproj"

          perl -0pi -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' "$pbxproj"
          grep -q 'CODE_SIGNING_ALLOWED = NO' "$pbxproj"

          set +e
          (
            cd apps/desktop
            npm run tauri -- ios build --ci --target aarch64
          )
          tauri_status=$?
          set -e

          app="$(find "$apple_dir" "$HOME/Library/Developer/Xcode/Archives" \
            -type d -path '*.xcarchive/Products/Applications/*.app' \
            -print -quit 2>/dev/null || true)"
          if [ -z "$app" ]; then
            echo "Tauri exited with $tauri_status and produced no archived app" >&2
            find "$apple_dir" -maxdepth 5 -type d -name '*.app' -print || true
            if [ "$tauri_status" -eq 0 ]; then
              tauri_status=1
            fi
            exit "$tauri_status"
          fi

          mkdir -p "$staging_dir/Payload" "$ipa_dir"
          ditto "$app" "$staging_dir/Payload/LibreTracks.app"
          (
            cd "$staging_dir"
            zip -qry --symlinks "$GITHUB_WORKSPACE/$ipa_dir/LibreTracks-unsigned.ipa" Payload
          )

      - name: Validate IPA structure and target
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find apps/desktop/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "Tauri completed but produced no IPA" >&2
            find apps/desktop/src-tauri/gen/apple/build -maxdepth 3 -type f -print || true
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/libretracks-ipa-check"
          mkdir -p "$verify_dir"
          unzip -q "$ipa" -d "$verify_dir"
          app="$(find "$verify_dir/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            echo "IPA does not contain Payload/<name>.app" >&2
            exit 1
          fi

          plist="$app/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          minimum_ios="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")"
          archs="$(lipo -archs "$app/$executable")"

          test "$bundle_id" = "com.libretracks.ios"
          test "$minimum_ios" = "15.0"
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "Expected arm64 executable, got: $archs" >&2; exit 1 ;;
          esac

          # Xcode strips the release executable's local symbol table, including
          # the internally referenced C ABI names. Use an engine-only runtime
          # diagnostic as a positive fingerprint that survives stripping.
          # Avoid grep -q under pipefail: its early exit can SIGPIPE strings and
          # turn a real match into status 141.
          if ! strings "$app/$executable" \
            | grep 'Could not activate the iOS audio session' >/dev/null; then
            echo "IPA executable does not contain the native iOS audio engine" >&2
            exit 1
          fi
          if strings "$app/$executable" | grep '"error":"no-link"' >/dev/null; then
            echo "IPA executable still contains the silent no-link engine" >&2
            exit 1
          fi
          # Positive fingerprint for the RemoteIO device backend. Without JUCE,
          # a device manager that failed to link would fall through to the
          # silent stub, which reports a different backend name entirely.
          if ! strings "$app/$executable" | grep 'coreaudio-ios' >/dev/null; then
            echo "IPA executable does not contain the iOS RemoteIO audio backend" >&2
            exit 1
          fi
          if ! find "$app" -path '*/voices/es/counts/1.wav' -print -quit \
            | grep . >/dev/null; then
            echo "IPA does not contain the bundled voice-guide bank" >&2
            exit 1
          fi

          # Apple reads the privacy manifest from the BUNDLE ROOT and rejects
          # the upload without it (ITMS-91053). Report where it actually landed
          # when it is missing from the root: the fix is a different resource
          # mapping, not a different manifest.
          if [ ! -f "$app/PrivacyInfo.xcprivacy" ]; then
            echo "IPA has no PrivacyInfo.xcprivacy at the bundle root" >&2
            find "$app" -name 'PrivacyInfo.xcprivacy' -print >&2 || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSPrivacyTracking' \
            "$app/PrivacyInfo.xcprivacy" > /dev/null

          echo "IPA: $ipa"
          echo "Bundle: $bundle_id"
          echo "Minimum iOS: $minimum_ios"
          echo "Architectures: $archs"
          echo "Audio engine: native static C++ engine linked (RemoteIO, no JUCE)"
          echo "Full pack: Bungee + FFmpeg + voice guide + pads enabled"
          echo "Privacy manifest: present at the bundle root"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LibreTracks-iOS-unsigned-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LibreTracks-iOS-build-diagnostics-${{ github.run_number }}
          path: |
            apps/desktop/src-tauri/gen/apple/project.yml
            apps/desktop/src-tauri/gen/apple/**/*.plist
            apps/desktop/src-tauri/gen/apple/**/*.pbxproj
          if-no-files-found: ignore
          retention-days: 7
