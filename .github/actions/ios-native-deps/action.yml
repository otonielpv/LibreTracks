name: Build iOS native dependencies
description: >-
  Builds Bungee, the LGPL FFmpeg decoder stack and the LibreTracks audio engine
  as static arm64 archives for an Apple iOS SDK, and leaves them in one
  directory ready for the Rust linker.

  Shared by the unsigned smoke build, the signed distribution build and the
  simulator build. Those must link byte-for-byte the same engine: if they
  drift, the IPA that gets tested stops being the IPA that ships, and the
  guardrails below (no JUCE, no silent stub) would only protect whichever copy
  still had them.

inputs:
  bungee-version:
    description: Bungee release tag to build.
    required: true
  ffmpeg-version:
    description: FFmpeg release to build.
    required: true
  deployment-target:
    description: Minimum iOS version, matching bundle.iOS.minimumSystemVersion.
    required: false
    default: "15.0"
  sdk:
    description: >-
      Apple SDK to build against: iphoneos (the device build that ships) or
      iphonesimulator (screenshots and UI checks on a runner, with no device
      involved). Both are arm64 — what differs is the sysroot and the
      minimum-version flag, and mixing them up produces archives the linker
      rejects with a confusing "building for iOS Simulator, but linking object
      file built for iOS".
    required: false
    default: iphoneos

outputs:
  lib-dir:
    description: Directory holding every static archive the Rust link step needs.
    value: ${{ steps.link-dir.outputs.path }}

runs:
  using: composite
  steps:
    - name: Resolve the SDK layout
      id: layout
      shell: bash
      env:
        IOS_SDK: ${{ inputs.sdk }}
      run: |
        set -euo pipefail
        # Per-SDK directories throughout: reusing one would silently link the
        # wrong platform into the archive, and the cache would then serve that
        # mistake to every later run.
        #
        # The iphoneos paths are spelled out rather than derived, so they stay
        # byte-identical to what they were before this action grew a second
        # SDK. Changing them would throw away the FFmpeg cache (a 15-minute
        # rebuild) and break the repo-relative fallback in
        # crates/lt-audio-engine-v2/build.rs, which looks for build-ios-link.
        case "$IOS_SDK" in
          iphoneos)
            suffix="arm64"
            bungee_dir="bungee-ios-sdk"
            ffmpeg_dir="vendor/ffmpeg-ios-arm64"
            build_dir="native/audio-engine-v2/build-ios-arm64"
            link_dir="native/audio-engine-v2/build-ios-link"
            ;;
          iphonesimulator)
            suffix="sim-arm64"
            bungee_dir="bungee-ios-sim-sdk"
            ffmpeg_dir="vendor/ffmpeg-ios-sim-arm64"
            build_dir="native/audio-engine-v2/build-ios-sim-arm64"
            link_dir="native/audio-engine-v2/build-ios-sim-link"
            ;;
          *) echo "::error::Unknown sdk '$IOS_SDK'; use iphoneos or iphonesimulator."; exit 1 ;;
        esac
        {
          echo "suffix=$suffix"
          echo "bungee-dir=$bungee_dir"
          echo "ffmpeg-dir=$ffmpeg_dir"
          echo "build-dir=$build_dir"
          echo "link-dir=$link_dir"
        } >> "$GITHUB_OUTPUT"

    - name: Verify Apple build tools
      shell: bash
      env:
        IOS_SDK: ${{ inputs.sdk }}
      run: |
        set -euo pipefail
        xcodebuild -version
        xcrun --sdk "$IOS_SDK" --show-sdk-version
        if ! command -v pod >/dev/null 2>&1; then
          brew install cocoapods
        fi
        pod --version

    - name: Cache Bungee iOS build
      id: bungee-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.layout.outputs.bungee-dir }}
        key: bungee-ios-${{ inputs.bungee-version }}-${{ steps.layout.outputs.suffix }}-ios${{ inputs.deployment-target }}

    - name: Build Bungee for iOS
      if: steps.bungee-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUNGEE_VERSION: ${{ inputs.bungee-version }}
        IOS_DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        IOS_SDK: ${{ inputs.sdk }}
        BUNGEE_DIR: ${{ steps.layout.outputs.bungee-dir }}
        ARCH_SUFFIX: ${{ steps.layout.outputs.suffix }}
      run: |
        set -euo pipefail
        src_dir="bungee-ios-src-$ARCH_SUFFIX"
        git clone --depth 1 --branch "$BUNGEE_VERSION" --recurse-submodules \
          https://github.com/bungee-audio-stretch/bungee.git "$src_dir"
        cmake -S "$src_dir" -B "$src_dir/build" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
          -DBUNGEE_BUILD_SHARED_LIBRARY=OFF \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DBUNGEE_VERSION="${BUNGEE_VERSION#v}"
        cmake --build "$src_dir/build" --target bungee_library pffft --parallel 3
        mkdir -p "$BUNGEE_DIR/include/bungee" "$BUNGEE_DIR/ios-arm64"
        cp "$src_dir"/bungee/*.h "$BUNGEE_DIR/include/bungee/"
        cp "$src_dir/build/libbungee.a" "$src_dir/build/libpffft.a" \
          "$BUNGEE_DIR/ios-arm64/"
        lipo -info "$BUNGEE_DIR/ios-arm64/libbungee.a"
        lipo -info "$BUNGEE_DIR/ios-arm64/libpffft.a"

    - name: Cache FFmpeg iOS build
      id: ffmpeg-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.layout.outputs.ffmpeg-dir }}
        key: ffmpeg-ios-${{ inputs.ffmpeg-version }}-${{ steps.layout.outputs.suffix }}-ios${{ inputs.deployment-target }}-static-lgpl-v1

    - name: Build LGPL FFmpeg for iOS
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FFMPEG_VERSION: ${{ inputs.ffmpeg-version }}
        IOS_DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        IOS_SDK: ${{ inputs.sdk }}
        FFMPEG_DIR: ${{ steps.layout.outputs.ffmpeg-dir }}
      run: bash scripts/build-ffmpeg-ios.sh "$PWD/$FFMPEG_DIR"

    # The engine is ~10 minutes of C++ that changes far less often than the
    # app around it. The SDK version goes in the key because a cached object
    # file built against another SDK is exactly the kind of thing that fails
    # later, somewhere else, in a way nobody connects back to a cache.
    - name: Read the SDK version
      id: sdk
      shell: bash
      env:
        IOS_SDK: ${{ inputs.sdk }}
      run: echo "version=$(xcrun --sdk "$IOS_SDK" --show-sdk-version)" >> "$GITHUB_OUTPUT"

    - name: Compute the engine cache key
      id: enginekey
      shell: bash
      run: |
        echo "key=engine-ios-${{ steps.layout.outputs.suffix }}-sdk${{ steps.sdk.outputs.version }}-bungee${{ inputs.bungee-version }}-ffmpeg${{ inputs.ffmpeg-version }}-${{ hashFiles(
          'native/audio-engine-v2/src/**',
          'native/audio-engine-v2/include/**',
          'native/audio-engine-v2/CMakeLists.txt',
          'native/audio-engine-v2/**/CMakeLists.txt') }}" >> "$GITHUB_OUTPUT"

    # restore + save, not the combined action: that one only writes when the
    # whole job succeeds, and these jobs routinely fail well after the engine
    # is built (a signing secret, a control that moved). Ten minutes of C++
    # should not be thrown away by a failure that has nothing to do with it.
    - name: Restore the engine build
      id: engine-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.layout.outputs.build-dir }}
          ${{ steps.layout.outputs.link-dir }}
        key: ${{ steps.enginekey.outputs.key }}

    - name: Build native audio engine for iOS
      if: steps.engine-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        IOS_DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        IOS_SDK: ${{ inputs.sdk }}
        BUNGEE_REL_DIR: ${{ steps.layout.outputs.bungee-dir }}
        FFMPEG_REL_DIR: ${{ steps.layout.outputs.ffmpeg-dir }}
        BUILD_REL_DIR: ${{ steps.layout.outputs.build-dir }}
        LINK_REL_DIR: ${{ steps.layout.outputs.link-dir }}
      run: |
        set -euo pipefail
        build_dir="$GITHUB_WORKSPACE/$BUILD_REL_DIR"
        link_dir="$GITHUB_WORKSPACE/$LINK_REL_DIR"
        ffmpeg_dir="$GITHUB_WORKSPACE/$FFMPEG_REL_DIR"
        bungee_dir="$GITHUB_WORKSPACE/$BUNGEE_REL_DIR"

        export PKG_CONFIG_PATH="$ffmpeg_dir/lib/pkgconfig"

        cmake -S native/audio-engine-v2 -B "$build_dir" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
          -DLT_ENGINE_BUILD_TESTS=OFF \
          -DLT_ENGINE_BUILD_BENCHES=OFF \
          -DLT_ENGINE_USE_JUCE=OFF \
          -DLT_ENGINE_USE_OBOE=OFF \
          -DLT_ENGINE_USE_FFMPEG=ON \
          -DLT_ENGINE_USE_LIBSNDFILE=ON \
          -DLT_ENGINE_USE_R8BRAIN=ON \
          -DLT_ENGINE_USE_BUNGEE=ON \
          -DLT_BUNGEE_DIR="$bungee_dir"
        cmake --build "$build_dir" --parallel 3

        mkdir -p "$link_dir"
        engine_archive="$(find "$build_dir" -name 'liblt_audio_engine_v2.a' -print -quit)"
        sndfile_archive="$(find "$build_dir" -name 'libsndfile.a' -print -quit)"
        test -n "$engine_archive"
        test -n "$sndfile_archive"
        cp "$engine_archive" "$link_dir/liblt_audio_engine_v2.a"
        cp "$sndfile_archive" "$link_dir/libsndfile.a"
        cp "$bungee_dir/ios-arm64/libbungee.a" \
           "$bungee_dir/ios-arm64/libpffft.a" \
           "$ffmpeg_dir/lib/libavformat.a" \
           "$ffmpeg_dir/lib/libavcodec.a" \
           "$ffmpeg_dir/lib/libavutil.a" \
           "$ffmpeg_dir/lib/libswresample.a" \
           "$link_dir/"
        echo "Engine built into $link_dir"

    - name: Save the engine build
      if: steps.engine-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.layout.outputs.build-dir }}
          ${{ steps.layout.outputs.link-dir }}
        key: ${{ steps.enginekey.outputs.key }}

    # Runs on every build, cached or not. These are the guardrails, and a
    # guardrail that only fires on a cache miss protects nothing: a cache
    # entry poisoned by a JUCE build would sail straight through.
    - name: Verify the link set
      id: link-dir
      shell: bash
      env:
        BUILD_REL_DIR: ${{ steps.layout.outputs.build-dir }}
        LINK_REL_DIR: ${{ steps.layout.outputs.link-dir }}
      run: |
        set -euo pipefail
        build_dir="$GITHUB_WORKSPACE/$BUILD_REL_DIR"
        link_dir="$GITHUB_WORKSPACE/$LINK_REL_DIR"

        for archive in liblt_audio_engine_v2.a libsndfile.a libbungee.a \
                       libpffft.a libavformat.a libavcodec.a libavutil.a \
                       libswresample.a; do
          if [ ! -f "$link_dir/$archive" ]; then
            echo "::error::$archive is missing from $link_dir. If this was a cache hit, bump the engine cache key."
            ls -la "$link_dir" || true
            exit 1
          fi
          lipo -info "$link_dir/$archive"
        done

        grep -q 'LT_ENGINE_USE_BUNGEE:BOOL=ON' "$build_dir/CMakeCache.txt"
        grep -q 'LT_ENGINE_USE_FFMPEG:BOOL=ON' "$build_dir/CMakeCache.txt"
        # JUCE must stay out of the iOS build. Its AGPLv3 licensing option is
        # incompatible with App Store distribution terms, and on iOS it only
        # ever wrapped RemoteIO — which audio_device_manager_ios.mm now owns.
        # A silent flip back to ON would build a shippable-looking IPA that
        # cannot legally ship, so fail the job instead.
        grep -q 'LT_ENGINE_USE_JUCE:BOOL=OFF' "$build_dir/CMakeCache.txt"

        echo "LT_ENGINE_IOS_LIB_DIR=$link_dir" >> "$GITHUB_ENV"
        echo "path=$link_dir" >> "$GITHUB_OUTPUT"
