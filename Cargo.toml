[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/libretracks-core",
    "crates/libretracks-project",
    "crates/libretracks-audio",
    "crates/libretracks-remote",
    "crates/libretracks-link",
    "crates/libretracks-cloud",
    "crates/libretracks-video",
    "crates/libretracks-analysis",
    "crates/lt-audio-engine-v2",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# midir with its iOS host-time calls replaced by public mach APIs: the
# original references private CoreAudio symbols and App Store Connect rejects
# the upload. See vendor/midir/LIBRETRACKS_PATCH.md.
[patch.crates-io]
midir = { path = "vendor/midir" }

# Full debug info made target-desktop-native/debug grow past 30 GB (the
# desktop lib alone is built as staticlib + cdylib + rlib). Line tables keep
# file:line in backtraces of our own crates; dependencies get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# "Analizar canción" is number crunching (FFT, MFCC, DTW): unoptimised it runs
# ~30x slower (grouping a guide: 23 s instead of 0.7 s), which made `tauri dev`
# useless for trying it. Only this crate, so dev builds stay quick.
[profile.dev.package.libretracks-analysis]
opt-level = 3
