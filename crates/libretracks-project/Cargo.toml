[package]
name = "libretracks-project"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
hound = "3"
libretracks-core = { path = "../libretracks-core" }
rayon = "1.10"
serde.workspace = true
serde_json.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror.workspace = true
zip = "2"

# statvfs, for the free-space check before extracting a package. Unix only:
# Windows uses GetDiskFreeSpaceExW directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS/iOS: the free space the system reports to users (Finder, Settings)
# counts purgeable space (local Time Machine snapshots, iCloud caches) that
# statvfs does not. Foundation's "important usage" capacity is that figure.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSValue"] }

[dev-dependencies]
tempfile = "3"
