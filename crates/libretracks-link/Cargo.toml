[package]
name = "libretracks-link"
version.workspace = true
edition.workspace = true
license.workspace = true

# Network sessions between LibreTracks apps (docs/plans/network-sessions).
# Not the remote: that is crates/libretracks-remote and stays independent.
# No Tauri, no audio engine, no platform cfg: it builds and tests everywhere.

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
