[package]
name = "libretracks-video"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Salida de vídeo de LibreTracks: libmpv cargada en ejecución, monitores, miniaturas y reproductor."

[dependencies]
libretracks-core = { path = "../libretracks-core" }
hound = "3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# libmpv is loaded at run time on the desktop only (plan video-mobile, regla
# 2: nothing of libmpv on Android/iOS, where AVPlayer and Media3 play).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
libloading = "0.8"

# macOS output surface (paso 15): AppKit panel + OpenGL views. The same
# objc2 family tao already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSEnumerator", "NSGeometry", "NSObject", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSEvent", "NSWindow", "NSPanel", "NSView", "NSScreen", "NSColor", "NSGraphics", "NSOpenGL", "NSOpenGLView", "objc2-open-gl", "objc2-core-foundation"] }
objc2-open-gl = { version = "0.3", default-features = false, features = ["std", "CGLTypes", "CGLCurrent"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSScreen", "objc2-core-foundation"] }
