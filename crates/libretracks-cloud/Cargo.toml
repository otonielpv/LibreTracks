[package]
name = "libretracks-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "net", "sync"] }
url = "2"

# Desktop credential stores only. keyring has no Android or iOS backend, so
# those targets need their own keystore/keychain implementation.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net"] }
