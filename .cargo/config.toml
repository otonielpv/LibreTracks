[build]
target-dir = "target-desktop-native"

[env]
LT_ENGINE_V2_LIB_DIR = { value = "native/audio-engine-v2/build-rb-on/Release", relative = true }
# whisper.cpp (whisper-rs-sys, speech recognition of guide tracks) is built
# with CMake. On Windows it must use the static CRT like the rest of the app
# (+crt-static below), or the link fails on __imp_fputs & co. Its
# CMakeLists asks for CMake 3.5, so the variable is only honoured with policy
# CMP0091 forced on. Both are ignored outside MSVC.
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
# The same crate also drops the optimisation flags on MSVC; this puts them
# back (see the file).
CMAKE_PROJECT_INCLUDE = { value = ".cargo/whisper-msvc-release.cmake", relative = true }
# ggml defaults to GGML_NATIVE=ON: it compiles for the CPU of the machine that
# builds it. 1.17.0 landed on a CI runner with AVX-512 and shipped zmm
# instructions, so "Analizar canción" crashed (illegal instruction) as soon as
# Whisper ran on any PC without AVX-512. OFF = fixed baseline (SSE4.2, AVX,
# AVX2, FMA, F16C on x86), the same level 1.16.0 happened to ship.
# whisper-rs-sys has no rerun-if-env-changed for this: after changing it,
# `cargo clean -p whisper-rs-sys` on every local target.
GGML_NATIVE = "OFF"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Google Play requires every native library in apps targeting Android 15+
# to support 16 KiB memory pages. NDK r28 uses this alignment by default;
# keeping the linker flags explicit also makes local builds with NDK r27 safe.
[target.'cfg(target_os = "android")']
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384",
  "-C", "link-arg=-Wl,-z,common-page-size=16384",
]
